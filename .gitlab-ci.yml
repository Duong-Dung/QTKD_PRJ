# =================================================================
# GitLab CI/CD Pipeline - QTKD ABC Logistics Solution
# Quản lý tự động hóa quy trình Restore, Build và Test
# =================================================================

stages:
  - restore
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

# Cache NuGet packages để tăng tốc độ pipeline
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

# Sử dụng Docker image chính thức của Microsoft .NET 10 SDK
default:
  image: mcr.microsoft.com/dotnet/sdk:10.0

# -------------------------------------------------------------
# 1. Restore Stage
# -------------------------------------------------------------
restore:solution:
  stage: restore
  script:
    - echo "=== Bắt đầu khôi phục NuGet packages ==="
    - dotnet restore QtkdSolution.sln
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# -------------------------------------------------------------
# 2. Build Stage
# -------------------------------------------------------------
build:solution:
  stage: build
  needs: ["restore:solution"]
  script:
    - echo "=== Bắt đầu biên dịch Solution (Release mode) ==="
    - dotnet build QtkdSolution.sln --no-restore --configuration Release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# -------------------------------------------------------------
# 3. Test Stage (Chạy UnitTests & IntegrationTests)
# -------------------------------------------------------------
test:all:
  stage: test
  needs: ["build:solution"]
  script:
    - echo "=== Bắt đầu chạy toàn bộ Unit Tests & Integration Tests ==="
    - dotnet test QtkdSolution.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"
  artifacts:
    when: always
    reports:
      junit: "**/test-results.trx"
    paths:
      - "**/TestResults/*.trx"
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
